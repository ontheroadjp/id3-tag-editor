<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MP3 Tag Editor</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><h1>MP3 Tag Editor</h1><span>閲覧・再生</span></header>
<main>
  <aside><h2>ファイル</h2><div id="directory"></div><div id="files"></div></aside>
  <section class="detail"><div id="status" role="status">ファイルを選択してください。</div><div id="selected" hidden>
    <div class="player"><div class="cover"><img id="artwork" alt="アートワーク" hidden><span id="no-artwork">画像なし</span></div><div class="playback"><h2 id="filename"></h2><audio id="audio" controls preload="metadata"></audio></div></div>
    <section class="tags"><h2>既存タグ</h2><dl id="tags"></dl></section>
  </div></section>
</main>
<script src="/static/app.js" defer></script>
</body></html>
